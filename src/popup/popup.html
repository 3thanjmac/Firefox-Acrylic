<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <img src="../../icons/icon.svg" alt="" width="28" height="28" />
      <div class="titles">
        <h1>Acrylic</h1>
        <p id="host" class="muted">&nbsp;</p>
      </div>
      <button id="open-options" class="icon-button" title="All settings" aria-label="All settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
            transform="translate(-1 0)"
          />
        </svg>
      </button>
    </header>

    <section id="permission-panel" class="notice" hidden>
      <p>Acrylic needs access to websites to restyle their backgrounds.</p>
      <button id="grant" class="primary">Allow on all websites</button>
    </section>

    <main id="site-panel" hidden>
      <label class="row switch-row">
        <span>
          Acrylic on this site
          <small id="override-note" class="muted"></small>
        </span>
        <input type="checkbox" id="enabled" class="switch" />
      </label>

      <fieldset id="tuning">
        <div class="field">
          <span class="label">Coverage</span>
          <div class="segmented" data-key="coverage" role="radiogroup">
            <button value="background" title="Replace only the page's root background">Background</button>
            <button value="deep" title="Also clear large containers painted with the page background color">Deep</button>
          </div>
        </div>

        <div class="field">
          <span class="label">Tone</span>
          <div class="segmented" data-key="tone" role="radiogroup">
            <button value="auto" title="Light or dark to match the page, keeping its text readable">Auto</button>
            <button value="light">Light</button>
            <button value="dark">Dark</button>
            <button value="base" title="Use the base color exactly">Base</button>
          </div>
        </div>

        <label class="field slider">
          <span class="label">Tint</span>
          <input type="range" id="tintOpacity" min="0" max="1" step="0.01" />
          <output for="tintOpacity"></output>
        </label>

        <label class="field slider">
          <span class="label">Blur</span>
          <input type="range" id="blur" min="0" max="150" step="1" />
          <output for="blur"></output>
        </label>

        <div class="field">
          <label class="check"><input type="checkbox" id="custom-color" /> Custom color</label>
          <input type="color" id="color" />
        </div>
      </fieldset>

      <p id="status" class="status muted"></p>

      <footer class="popup-footer">
        <span class="muted">Toggle: <kbd id="shortcut">Alt+Shift+A</kbd></span>
        <button id="reset">Reset site</button>
      </footer>
    </main>

    <main id="newtab-panel" hidden>
      <label class="row switch-row">
        <span>Acrylic on new tab &amp; home</span>
        <input type="checkbox" id="homepage" class="switch" />
      </label>
    </main>

    <main id="unsupported-panel" hidden>
      <p class="muted">Firefox doesn't let extensions change this page.</p>
    </main>

    <script src="../shared/acrylic.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
